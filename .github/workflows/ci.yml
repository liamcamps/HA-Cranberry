# Checks the theme on every push and pull request.
# On main, when the version at the top of the theme has no release yet, it publishes one
# (tag v<version>, notes from CHANGELOG.md), so HACS offers the update by itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valid YAML, light and dark mode
        run: |
          python3 - <<'PY'
          import yaml
          t = yaml.safe_load(open('themes/cranberry_canvas.yaml'))
          assert len(t) == 1, 'one theme per file'
          name, theme = next(iter(t.items()))
          modes = theme.get('modes', {})
          assert 'light' in modes and 'dark' in modes, 'light and dark mode'
          print(name, len(modes['light']), 'light keys,', len(modes['dark']), 'dark keys')
          PY
      - name: Every colour pair is readable (4.5:1 text, 3:1 marks)
        run: python3 tools/contrast.py
      - name: Version has a changelog section
        run: |
          VER=$(grep -oP "^# Version: \K[0-9.]+" themes/cranberry_canvas.yaml)
          echo "theme $VER"
          grep -q "^## $VER " CHANGELOG.md || { echo "CHANGELOG.md has no section for $VER"; exit 1; }

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: theme
          ignore: brands description topics images license  # license: only needed for the HACS default store

  release:
    needs: [check, hacs]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the version
        id: v
        run: |
          VER=$(grep -oP "^# Version: \K[0-9.]+" themes/cranberry_canvas.yaml)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$VER is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "v$VER will be released"
          fi
      - name: Publish the release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          awk -v h="## $VER " 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          gh release create "v$VER" themes/cranberry_canvas.yaml --title "$VER" --notes-file notes.md --target "$GITHUB_SHA"
